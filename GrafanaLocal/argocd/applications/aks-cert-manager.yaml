# ArgoCD Application: cert-manager
# This ArgoCD Application deploys cert-manager to AKS so Certificate and ClusterIssuer
# resources in the ops bundle can reconcile and provision TLS secrets for Traefik ingresses.
# See VERSIONS.md for version tracking. Current: cert-manager chart 1.20.0
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: cert-manager
    cluster: aks-canepro
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.0
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: true
        webhook:
          validatingWebhookConfiguration:
            namespaceSelector:
              matchExpressions:
                - key: cert-manager.io/disable-validation
                  operator: NotIn
                  values:
                    - "true"
                - key: control-plane
                  operator: NotIn
                  values:
                    - "true"
                - key: kubernetes.azure.com/managedby
                  operator: NotIn
                  values:
                    - aks
  destination:
    server: https://aks-canepro-pjvw5eyz.hcp.uksouth.azmk8s.io:443
    namespace: cert-manager
  # cert-manager and the AKS API server add webhook runtime/default fields that
  # the upstream Helm chart does not render. Ignore only those generated values.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/0/clientConfig/service/port
        - /webhooks/0/objectSelector
        - /webhooks/0/rules/0/scope
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
